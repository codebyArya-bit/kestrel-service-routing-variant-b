<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kestrel routing desk</title>
<style>body{font:16px system-ui;background:#f1f5f7;color:#172c39;margin:0}main{max-width:850px;margin:40px auto;padding:24px;background:white;border-radius:12px}h1{margin-bottom:8px}.mode{background:#fff3c9;padding:12px;border-left:4px solid #a77a00}label{display:block;margin-top:18px;font-weight:600}textarea,select,button{font:inherit;padding:10px;border:1px solid #8a9ca6;border-radius:5px;box-sizing:border-box}textarea{width:100%;min-height:130px}select{width:100%}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}button{margin-top:18px;background:#174b64;color:white;cursor:pointer}button:disabled{opacity:.6}#error{color:#a32323}#result{margin-top:24px;padding:20px;background:#eef6f8}li{margin:8px 0}@media(max-width:600px){main{margin:0}.fields{grid-template-columns:1fr}}</style></head>
<body><main><h1>Kestrel routing desk</h1><p>Suggest a team for an incoming customer request.</p><p class="mode">{{MODE}}</p><p>Decision support only. Scores are model support, not calibrated probabilities. Multi-intent requests may require employee review even when the model does not flag them.</p>
<form id="form"><label for="text">Customer request</label><textarea id="text" required maxlength="10000" placeholder="Enter the customer’s request"></textarea>
<div class="fields"><div><label for="channel">Channel</label><select id="channel"><option>web</option><option>chat</option><option>email</option><option>ivr</option><option>whatsapp</option></select></div><div><label for="product">Product family</label><select id="product"><option>Water Purifier</option><option>Air Fryer</option><option>Ceiling Fan</option><option>Induction Cooktop</option><option>Mixer Grinder</option><option>Robot Vacuum</option><option>Room Heater</option><option>appliance</option></select></div><div><label for="warranty">Warranty status</label><select id="warranty"><option>unknown</option><option>in_warranty</option><option>out_of_warranty</option><option>shield</option></select></div></div>
<button type="submit" id="submit">Suggest team</button> <button type="button" id="example">Use synthetic example</button></form>
<p id="error" role="alert"></p><section id="result" hidden aria-live="polite"><h2 id="team"></h2><p id="status"></p><p id="score"></p><h3>Reasons</h3><ul id="reasons"></ul><h3>Alternatives</h3><ul id="alternatives"></ul></section>
<script>
const el=id=>document.getElementById(id);
const display=team=>({'Installations':'Installs & Demo','Consumables':'Filters & Consumables'}[team]||team);
el('example').addEventListener('click',()=>{el('text').value='Please arrange installation and a demonstration of my new water purifier.';el('channel').value='web';el('product').value='Water Purifier';el('warranty').value='unknown';el('text').focus()});
function list(id, values){el(id).replaceChildren();for(const value of values){const item=document.createElement('li');item.textContent=value;el(id).append(item)}}
el('form').addEventListener('submit',async event=>{event.preventDefault();el('submit').disabled=true;el('example').disabled=true;el('error').textContent='';el('result').hidden=true;try{const response=await fetch('/api/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_text:el('text').value,channel:el('channel').value,product_family:el('product').value,warranty_status:el('warranty').value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Routing failed.');el('team').textContent=result.display_team;el('status').textContent=(result.review_required?'HUMAN REVIEW REQUIRED':'Suggested route — employee confirmation advised')+' · '+result.mode+' mode';el('score').textContent='Model support: '+result.model_score.toFixed(3);list('reasons',result.reasons);list('alternatives',result.alternatives.map(item=>display(item.team)+' · '+item.model_score.toFixed(3)));el('result').hidden=false}catch(error){el('error').textContent=error.message||'Service unavailable. Please retry.'}finally{el('submit').disabled=false;el('example').disabled=false}});
</script></main></body></html>
